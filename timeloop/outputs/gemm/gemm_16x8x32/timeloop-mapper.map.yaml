mapping:
  - target: reg
    type: datatype
    keep:
      - Inputs
      - Weights
      - Outputs
    bypass:
      []
  - target: inter_PE_spatial
    type: datatype
    keep:
      []
    bypass:
      - Inputs
      - Weights
      - Outputs
  - target: buffer
    type: datatype
    keep:
      - Inputs
      - Weights
      - Outputs
    bypass:
      []
  - target: DRAM
    type: datatype
    keep:
      - Inputs
      - Weights
      - Outputs
    bypass:
      []
  - target: reg
    type: temporal
    factors: M1 N1 K1
    permutation: MNK
  - target: inter_PE_spatial
    type: spatial
    factors: M1 N2 K8
    permutation: NKM
    split: 2
  - target: inter_PE_spatial
    type: temporal
    factors: M1 N1 K1
    permutation: MNK
  - target: buffer
    type: temporal
    factors: M16 N2 K4
    permutation: MNK
  - target: DRAM
    type: temporal
    factors: M1 N2 K1
    permutation: NMK